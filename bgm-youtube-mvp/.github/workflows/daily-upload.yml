# Optional: run the pipeline daily on a self-hosted GPU runner.
# GitHub-hosted runners do not have GPUs, so generation on a CPU runner is
# impractically slow. Configure a self-hosted runner with a CUDA GPU and
# label it "gpu", then this workflow will use it.

name: Daily BGM Upload

on:
  schedule:
    - cron: "0 21 * * *"  # 06:00 JST = 21:00 UTC
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cu121
          pip install -r requirements.txt

      - name: Restore YouTube token + client secrets from secrets
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_CLIENT_SECRETS_JSON" > client_secret.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json

      - name: Run pipeline
        env:
          DEVICE: cuda
          YOUTUBE_PRIVACY: public
        run: python -m src.pipeline --config config.yaml
